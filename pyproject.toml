[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerosol-studio"
version = "0.1.0"
description = "Interactive aerosol particle size distribution analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
  { name = "Gaurav K. Srivastav" },
  { name = "Janne Lampilahti" },
  { name = "Katrianne Lehtipalo" },
  { name = "Shahzad Gani" }
]
keywords = [
  "aerosol science",
  "atmospheric measurements",
  "particle size distribution",
  "Bokeh",
  "NetCDF",
  "CSV"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "bokeh>=3.6",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "xarray>=2024.1",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
  "scikit-learn>=1.3",
  "kneed>=0.8.5",
  "scipy>=1.11",
  "joblib>=1.3",
  "aerosol-functions>=0.1.16",
  "tzdata>=2024.1; sys_platform == 'win32'",
  "tzlocal>=5.2",
]

[project.urls]
Homepage = "https://github.com/Grivs567/aerosol-studio"
Source = "https://github.com/Grivs567/aerosol-studio"
Documentation = "https://github.com/Grivs567/aerosol-studio#readme"
Issues = "https://github.com/Grivs567/aerosol-studio/issues"

[project.scripts]
aerosol-studio = "aerosolstudio.app.launcher:run_app"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["aerosolstudio*"]
